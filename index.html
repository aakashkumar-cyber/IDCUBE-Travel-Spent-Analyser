  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 syncVw=()=>{ this.setState({vw: window.innerWidth || this.state.vw}); };\n    requestAnimationFrame(syncVw); setTimeout(syncVw,180); setTimeout(syncVw,600);\n    // ResizeObserver reliably catches the post-load iframe sizing that fixed-delay timeouts miss\n    if(typeof ResizeObserver!=='undefined'){ this._ro=new ResizeObserver(syncVw); try{ this._ro.observe(document.documentElement); }catch(e){} }\n    if(window.MMT_DATA){ this.setState({ready:true}); return; }\n    // Poll for the global injected by the data.js script (works on file:// where fetch is blocked)\n    let tries=0;\n    this._poll = setInterval(()=>{\n      tries++;\n      if(window.MMT_DATA){ clearInterval(this._poll); this.setState({ready:true}); return; }\n      if(tries>40){ // ~6s — fall back to fetch (works when served over http)\n        clearInterval(this._poll);\n        fetch('data.js').then(r=>r.text()).then(t=>{\n          const i=t.indexOf('='); const json=t.slice(i+1).replace(/;\\s*$/,'');\n          window.MMT_DATA=JSON.parse(json);\n          this.setState({ready:true});\n        }).catch(e=>{ console.error('data load failed',e); });\n      }\n    },150);\n  }\n  componentWillUnmount(){ if(this._onResize) window.removeEventListener('resize', this._onResize); if(this._onScroll) window.removeEventListener('scroll', this._onScroll); if(this._poll) clearInterval(this._poll); if(this._ro) this._ro.disconnect(); [this._t1,this._t2,this._t3].forEach(t=>t&&clearTimeout(t)); }\n\n  // ===== cinematic boot + count-up engine =====\n  componentDidUpdate(){ if(this.state.ready) this.scheduleReveal(); this.runCountUps(); }\n  setRoot=(n)=>{ if(n) this._root=n; };\n  scheduleReveal(){\n    if(this._revScheduled) return; this._revScheduled=true;\n    if(this._reduce){ this.setState({revealed:true,exit:true,introGone:true}); return; }\n    const now=(typeof performance!=='undefined'?performance.now():Date.now());\n    const wait=Math.max(0, 1400-(now-(this._introStart||now)));\n    this._t1=setTimeout(()=>this.setState({revealed:true}), wait);\n    this._t2=setTimeout(()=>this.setState({exit:true}), wait+180);\n    this._t3=setTimeout(()=>this.setState({introGone:true}), wait+1060);\n  }\n  skipIntro(){ if(this.state.introGone) return; [this._t1,this._t2,this._t3].forEach(t=>t&&clearTimeout(t)); this.setState({revealed:true,exit:true}); setTimeout(()=>this.setState({introGone:true}),700); }\n  animSig(){ return this.state.view+'|'+this.monthSel().join(',')+'|'+this.state.scope+'|'+(this.state.query||''); }\n  runCountUps(){\n    if(this._reduce || !this.state.revealed || typeof document==='undefined') return;\n    const sig=this.animSig(); if(sig===this._cuSig) return; this._cuSig=sig;\n    const root=this._root||document; const nodes=root.querySelectorAll('[data-cu]');\n    for(let i=0;i<nodes.length;i++) this.countUp(nodes[i]);\n  }\n  countUp(node){\n    const txt=node.textContent; const m=txt.match(/-?\\d[\\d,]*(\\.\\d+)?/); if(!m) return;\n    const numStr=m[0], pre=txt.slice(0,m.index), suf=txt.slice(m.index+numStr.length);\n    const hasComma=numStr.indexOf(',')>=0, dot=numStr.indexOf('.'), dec=dot>=0?numStr.length-dot-1:0;\n    const target=parseFloat(numStr.replace(/,/g,'')); if(!isFinite(target)) return;\n    if(node._cuRaf) cancelAnimationFrame(node._cuRaf); if(node._cuTo) clearTimeout(node._cuTo);\n    const dur=1050, t0=(typeof performance!=='undefined'?performance.now():Date.now());\n    const fmt=(v)=>{ const neg=v<0; v=Math.abs(v); let s=v.toFixed(dec), ip=s, fp=''; const di=s.indexOf('.'); if(di>=0){ ip=s.slice(0,di); fp=s.slice(di); } if(hasComma){ let l3=ip.slice(-3), rest=ip.slice(0,-3); rest=rest.replace(/\\B(?=(\\d{2})+(?!\\d))/g,','); ip=(rest?rest+',':'')+l3; } return (neg?'-':'')+ip+fp; };\n    const ease=(t)=>1-Math.pow(1-t,3);\n    const tick=(nw)=>{ let p=(nw-t0)/dur; if(p>1)p=1; node.textContent=pre+fmt(target*ease(p))+suf; if(p<1){ node._cuRaf=requestAnimationFrame(tick); } else { node.textContent=txt; node._cuRaf=null; } };\n    node.textContent=txt;\n    node._cuRaf=requestAnimationFrame(()=>{ node.textContent=pre+fmt(0)+suf; node._cuRaf=requestAnimationFrame(tick); });\n    node._cuTo=setTimeout(()=>{ if(node._cuRaf){ cancelAnimationFrame(node._cuRaf); node._cuRaf=null; } node.textContent=txt; }, dur+260);\n  }\n  renderIntro(){\n    if(this.state.introGone) return null;\n    const h=React.createElement; const logo=(window.__resources&&window.__resources.idcubeMark)||'idcube-mark.png';\n    return h('div',{onClick:()=>this.skipIntro(),\n      style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',\n        background:'radial-gradient(125% 120% at 50% 28%, #19294A 0%, #0E1726 56%, #080D18 100%)',\n        transform:this.state.exit?'translateY(-102%)':'translateY(0)',\n        transition:'transform .85s cubic-bezier(.7,0,.18,1)',overflow:'hidden'}},\n      h('div',{className:'intro-orb',style:{top:'16%',left:'20%',width:300,height:300,background:'radial-gradient(circle,rgba(79,70,229,.5),transparent 70%)'}}),\n      h('div',{className:'intro-orb',style:{bottom:'14%',right:'18%',width:340,height:340,background:'radial-gradient(circle,rgba(13,148,136,.42),transparent 70%)',animationDelay:'1.6s'}}),\n      h('div',{style:{position:'relative',textAlign:'center',color:'#fff',padding:20}},\n        h('div',{className:'intro-logo',style:{width:88,height:88,margin:'0 auto 24px',borderRadius:22,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',padding:13,boxSizing:'border-box'}},\n          h('img',{src:logo,alt:'IDCUBE',style:{width:'100%',height:'100%',objectFit:'contain',display:'block'}})),\n        h('div',{className:'intro-word',style:{fontSize:36,fontWeight:700,letterSpacing:'-.02em',lineHeight:1}},'IDCUBE'),\n        h('div',{className:'intro-sub',style:{fontSize:12,letterSpacing:'.46em',textTransform:'uppercase',color:'#9AA8BC',marginTop:10,paddingLeft:'.46em'}},'Travel Spend Analyser'),\n        h('div'
